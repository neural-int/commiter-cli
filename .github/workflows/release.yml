name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CGO_ENABLED: "1"
      GOOS: darwin
      GOARCH: arm64
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.version.outputs.archive }}
      tag_sha: ${{ steps.release_tag.outputs.tag_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

          version="${tag#v}"
          archive="commiter_${version}_darwin_arm64.zip"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify release tag belongs to main
        id: release_tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse "refs/tags/${TAG}")"
          release_commit="$(git rev-list -n 1 "$TAG")"

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::origin/main is unavailable after checkout"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag $TAG must point to a commit contained in main"
            exit 1
          fi

          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run Swift helper tests
        run: |
          xcodebuild -version
          swift --version
          swift test --package-path mlx-helper --triple arm64-apple-macosx14.0

      - name: Run release preflight
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          xcodebuild -version
          swift --version
          bash .github/scripts/release-preflight.sh "$VERSION" "$ARCHIVE"

      - name: Archive validated MLX helper
        shell: bash
        run: |
          set -euo pipefail
          tar -cf "$RUNNER_TEMP/commiter-mlx-helper.tar" \
            -C dist \
            commiter-mlx-helper \
            mlx.metallib

      - name: Upload validated MLX helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commiter-mlx-helper-${{ github.run_id }}
          path: ${{ runner.temp }}/commiter-mlx-helper.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  release:
    name: Build, sign, notarize, and publish
    needs: validate
    environment: release
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      archive: ${{ needs.validate.outputs.archive }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CGO_ENABLED: "1"
      GOOS: darwin
      GOARCH: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v6.0.0
        with:
          python-version: "3.12"

      - name: Generate and validate bilingual release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: |
          set -euo pipefail

          previous_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            git rev-list "${previous_tag}..${TAG}" > "$RUNNER_TEMP/release-commits.txt"
          else
            git rev-list "$TAG" > "$RUNNER_TEMP/release-commits.txt"
          fi

          gh api \
            --paginate \
            --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&per_page=100" \
            > "$RUNNER_TEMP/release-pr-pages.json"
          jq 'add' "$RUNNER_TEMP/release-pr-pages.json" \
            > "$RUNNER_TEMP/release-prs.json"

          python3 .github/scripts/release-notes/collect.py \
            --prs "$RUNNER_TEMP/release-prs.json" \
            --commits "$RUNNER_TEMP/release-commits.txt" \
            --output "$RUNNER_TEMP/release-notes-english.json"

          if [[ "$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["entries"]))' "$RUNNER_TEMP/release-notes-english.json")" == "0" ]]; then
            printf '%s\n' '{"entries": []}' > "$RUNNER_TEMP/release-notes-japanese.json"
          else
            python3 .github/scripts/release-notes/translate.py \
              --input "$RUNNER_TEMP/release-notes-english.json" \
              --output "$RUNNER_TEMP/release-notes-japanese.json"
            python3 .github/scripts/release-notes/validate.py \
              --english "$RUNNER_TEMP/release-notes-english.json" \
              --japanese "$RUNNER_TEMP/release-notes-japanese.json"
          fi

          python3 .github/scripts/release-notes/render.py \
            --entries "$RUNNER_TEMP/release-notes-english.json" \
            --japanese "$RUNNER_TEMP/release-notes-japanese.json" \
            --output release-notes.md \
            --previous-tag "$previous_tag" \
            --current-tag "$TAG" \
            --repository "$GITHUB_REPOSITORY"

          test -s release-notes.md

      - name: Verify release credentials are configured
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HOMEBREW_DEVTOOLS_TOKEN: ${{ secrets.HOMEBREW_DEVTOOLS_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            HOMEBREW_DEVTOOLS_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build release binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/natsuki0413/commiter-cli/internal/cli.Version=${VERSION}" \
            -o dist/commiter \
            ./cmd/commiter

      - name: Download validated MLX helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commiter-mlx-helper-${{ github.run_id }}
          path: ${{ runner.temp }}/commiter-mlx-helper

      - name: Restore validated MLX helper
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "$RUNNER_TEMP/commiter-mlx-helper/commiter-mlx-helper.tar" -C dist
          test -x dist/commiter-mlx-helper
          test -s dist/mlx.metallib

      - name: Verify binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          actual_version="$(dist/commiter version)"
          expected_version="commiter ${VERSION}"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Version mismatch: expected '$expected_version', got '$actual_version'"
            exit 1
          fi

          archs="$(lipo -archs dist/commiter)"
          if [[ "$archs" != "arm64" ]]; then
            echo "::error::Expected arm64 Mach-O, got: $archs"
            exit 1
          fi

          file dist/commiter
          test -x dist/commiter-mlx-helper
          test -s dist/mlx.metallib
          helper_archs="$(lipo -archs dist/commiter-mlx-helper)"
          if [[ "$helper_archs" != "arm64" ]]; then
            echo "::error::Expected arm64 MLX helper, got: $helper_archs"
            exit 1
          fi
          helper_target="$(otool -l dist/commiter-mlx-helper | awk '
            $1 == "cmd" && $2 == "LC_BUILD_VERSION" { in_build = 1; next }
            in_build && $1 == "minos" { print $2; exit }
          ')"
          if [[ "$helper_target" != "14.0" ]]; then
            echo "::error::Expected MLX helper deployment target 14.0, got: ${helper_target:-unknown}"
            exit 1
          fi
          unexpected_dependencies="$(otool -L dist/commiter-mlx-helper | awk '
            NR == 1 { next }
            {
              dependency = $1
              if (dependency !~ /^\/usr\/lib\// && dependency !~ /^\/System\/Library\//) {
                print dependency
              }
            }
          ')"
          if [[ -n "$unexpected_dependencies" ]]; then
            echo "::error::MLX helper has dependencies outside macOS system libraries: $unexpected_dependencies"
            exit 1
          fi

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/commiter-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          echo "COMMITER_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Sign binary
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --keychain "$COMMITER_KEYCHAIN_PATH" \
            dist/commiter
          codesign --verify --strict --verbose=2 dist/commiter
          codesign --display --verbose=4 dist/commiter

      - name: Sign MLX helper
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --keychain "$COMMITER_KEYCHAIN_PATH" \
            dist/commiter-mlx-helper
          codesign --verify --strict --verbose=2 dist/commiter-mlx-helper

      - name: Create release archive
        shell: bash
        env:
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: bash .github/scripts/build-release-package.sh "$ARCHIVE"

      - name: Verify packaged helper layout and signatures
        shell: bash
        env:
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: bash .github/scripts/verify-release-package.sh "$ARCHIVE" true

      - name: Store notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "commiter-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$COMMITER_KEYCHAIN_PATH"

      - name: Notarize release archive
        shell: bash
        env:
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          set -euo pipefail

          result_path="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "dist/${ARCHIVE}" \
            --keychain-profile "commiter-notary" \
            --keychain "$COMMITER_KEYCHAIN_PATH" \
            --wait \
            --output-format json > "$result_path"

          status="$(plutil -extract status raw -o - "$result_path")"
          submission_id="$(plutil -extract id raw -o - "$result_path" 2>/dev/null || true)"

          cat "$result_path"

          if [[ "$status" != "Accepted" ]]; then
            echo "::error::Notarization failed with status: $status"
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --keychain-profile "commiter-notary" \
                --keychain "$COMMITER_KEYCHAIN_PATH" || true
            fi
            exit 1
          fi

      - name: Generate checksum
        id: checksum
        shell: bash
        env:
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          set -euo pipefail
          (
            cd dist
            shasum -a 256 "$ARCHIVE" > checksums.txt
          )
          cat dist/checksums.txt
          sha256="$(awk '{print $1}' dist/checksums.txt)"
          if [[ ! "$sha256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "::error::Failed to parse SHA-256 from checksums.txt"
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VALIDATED_TAG_SHA: ${{ needs.validate.outputs.tag_sha }}
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          set -euo pipefail

          current_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [[ "$current_tag_sha" != "$VALIDATED_TAG_SHA" ]]; then
            echo "::error::Release tag $TAG moved after validation"
            exit 1
          fi

          if is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $TAG already exists and is published"
              exit 1
            fi

            gh release upload "$TAG" \
              "dist/${ARCHIVE}" \
              dist/checksums.txt \
              --clobber
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              "dist/${ARCHIVE}" \
              dist/checksums.txt \
              --verify-tag \
              --draft \
              --notes-file release-notes.md \
              --title "$TAG"
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VALIDATED_TAG_SHA: ${{ needs.validate.outputs.tag_sha }}
        run: |
          set -euo pipefail

          current_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [[ "$current_tag_sha" != "$VALIDATED_TAG_SHA" ]]; then
            echo "::error::Release tag $TAG moved after validation"
            exit 1
          fi

          gh release edit "$TAG" --draft=false --latest

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/commiter-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"

  # HOMEBREW_DEVTOOLS_TOKEN is a fine-grained PAT for neural-int/homebrew-devtools
  # with Contents: Read and write. It is used only to send repository_dispatch.
  notify-homebrew-tap:
    name: Notify Homebrew tap
    needs: release
    if: github.repository == 'neural-int/commiter-cli'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      ARCHIVE: ${{ needs.release.outputs.archive }}
      SHA256: ${{ needs.release.outputs.sha256 }}
      TAP_REPO: neural-int/homebrew-devtools
    steps:
      - name: Verify tap token
        shell: bash
        env:
          HOMEBREW_DEVTOOLS_TOKEN: ${{ secrets.HOMEBREW_DEVTOOLS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_DEVTOOLS_TOKEN:-}" ]]; then
            echo "::error::Missing required secret: HOMEBREW_DEVTOOLS_TOKEN"
            exit 1
          fi

      - name: Dispatch commiter-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DEVTOOLS_TOKEN }}
        run: |
          set -euo pipefail

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE}"
          jq -n \
            --arg event_type "commiter-release" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg url "$url" \
            --arg sha256 "$SHA256" \
            '{
              event_type: $event_type,
              client_payload: {
                version: $version,
                tag: $tag,
                url: $url,
                sha256: $sha256
              }
            }' | gh api --method POST --input - "repos/${TAP_REPO}/dispatches"
