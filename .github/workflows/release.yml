name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: macos-15
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CGO_ENABLED: "1"
      GOOS: darwin
      GOARCH: arm64
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.version.outputs.archive }}
      tag_sha: ${{ steps.release_tag.outputs.tag_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

          version="${tag#v}"
          archive="commiter_${version}_darwin_arm64.zip"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify release tag belongs to main
        id: release_tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse "refs/tags/${TAG}")"
          release_commit="$(git rev-list -n 1 "$TAG")"

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::origin/main is unavailable after checkout"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag $TAG must point to a commit contained in main"
            exit 1
          fi

          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build release binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/natsuki0413/commiter-cli/internal/cli.Version=${VERSION}" \
            -o dist/commiter \
            ./cmd/commiter

      - name: Verify binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          actual_version="$(dist/commiter version)"
          expected_version="commiter ${VERSION}"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Version mismatch: expected '$expected_version', got '$actual_version'"
            exit 1
          fi

          archs="$(lipo -archs dist/commiter)"
          if [[ "$archs" != "arm64" ]]; then
            echo "::error::Expected arm64 Mach-O, got: $archs"
            exit 1
          fi

          file dist/commiter

  release:
    name: Build, sign, notarize, and publish
    needs: validate
    environment: release
    runs-on: macos-15
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      archive: ${{ needs.validate.outputs.archive }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CGO_ENABLED: "1"
      GOOS: darwin
      GOARCH: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Verify release credentials are configured
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HOMEBREW_DEVTOOLS_TOKEN: ${{ secrets.HOMEBREW_DEVTOOLS_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            HOMEBREW_DEVTOOLS_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build release binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/natsuki0413/commiter-cli/internal/cli.Version=${VERSION}" \
            -o dist/commiter \
            ./cmd/commiter

      - name: Verify binary
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          actual_version="$(dist/commiter version)"
          expected_version="commiter ${VERSION}"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Version mismatch: expected '$expected_version', got '$actual_version'"
            exit 1
          fi

          archs="$(lipo -archs dist/commiter)"
          if [[ "$archs" != "arm64" ]]; then
            echo "::error::Expected arm64 Mach-O, got: $archs"
            exit 1
          fi

          file dist/commiter

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/commiter-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          echo "COMMITER_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Sign binary
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --keychain "$COMMITER_KEYCHAIN_PATH" \
            dist/commiter
          codesign --verify --strict --verbose=2 dist/commiter
          codesign --display --verbose=4 dist/commiter

      - name: Create release archive
        shell: bash
        env:
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          set -euo pipefail
          package_dir="dist/package"
          mkdir -p "$package_dir"
          cp dist/commiter "$package_dir/commiter"
          cp LICENSE "$package_dir/LICENSE"
          (
            cd "$package_dir"
            zip -X -q "../${ARCHIVE}" commiter LICENSE
          )

      - name: Store notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "commiter-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$COMMITER_KEYCHAIN_PATH"

      - name: Notarize release archive
        shell: bash
        env:
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          set -euo pipefail

          result_path="$RUNNER_TEMP/notary-result.json"
          xcrun notarytool submit "dist/${ARCHIVE}" \
            --keychain-profile "commiter-notary" \
            --keychain "$COMMITER_KEYCHAIN_PATH" \
            --wait \
            --output-format json > "$result_path"

          status="$(plutil -extract status raw -o - "$result_path")"
          submission_id="$(plutil -extract id raw -o - "$result_path" 2>/dev/null || true)"

          cat "$result_path"

          if [[ "$status" != "Accepted" ]]; then
            echo "::error::Notarization failed with status: $status"
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --keychain-profile "commiter-notary" \
                --keychain "$COMMITER_KEYCHAIN_PATH" || true
            fi
            exit 1
          fi

      - name: Generate checksum
        id: checksum
        shell: bash
        env:
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          set -euo pipefail
          (
            cd dist
            shasum -a 256 "$ARCHIVE" > checksums.txt
          )
          cat dist/checksums.txt
          sha256="$(awk '{print $1}' dist/checksums.txt)"
          if [[ ! "$sha256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo "::error::Failed to parse SHA-256 from checksums.txt"
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VALIDATED_TAG_SHA: ${{ needs.validate.outputs.tag_sha }}
          ARCHIVE: ${{ needs.validate.outputs.archive }}
        run: |
          set -euo pipefail

          current_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [[ "$current_tag_sha" != "$VALIDATED_TAG_SHA" ]]; then
            echo "::error::Release tag $TAG moved after validation"
            exit 1
          fi

          if is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $TAG already exists and is published"
              exit 1
            fi

            gh release upload "$TAG" \
              "dist/${ARCHIVE}" \
              dist/checksums.txt \
              --clobber
          else
            gh release create "$TAG" \
              "dist/${ARCHIVE}" \
              dist/checksums.txt \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "$TAG"
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VALIDATED_TAG_SHA: ${{ needs.validate.outputs.tag_sha }}
        run: |
          set -euo pipefail

          current_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [[ "$current_tag_sha" != "$VALIDATED_TAG_SHA" ]]; then
            echo "::error::Release tag $TAG moved after validation"
            exit 1
          fi

          gh release edit "$TAG" --draft=false --latest

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/commiter-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"

  # HOMEBREW_DEVTOOLS_TOKEN is a fine-grained PAT for neural-int/homebrew-devtools
  # with Contents: Read and write. It is used only to send repository_dispatch.
  notify-homebrew-tap:
    name: Notify Homebrew tap
    needs: release
    if: github.repository == 'neural-int/commiter-cli'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      ARCHIVE: ${{ needs.release.outputs.archive }}
      SHA256: ${{ needs.release.outputs.sha256 }}
      TAP_REPO: neural-int/homebrew-devtools
    steps:
      - name: Verify tap token
        shell: bash
        env:
          HOMEBREW_DEVTOOLS_TOKEN: ${{ secrets.HOMEBREW_DEVTOOLS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_DEVTOOLS_TOKEN:-}" ]]; then
            echo "::error::Missing required secret: HOMEBREW_DEVTOOLS_TOKEN"
            exit 1
          fi

      - name: Dispatch commiter-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_DEVTOOLS_TOKEN }}
        run: |
          set -euo pipefail

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE}"
          jq -n \
            --arg event_type "commiter-release" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg url "$url" \
            --arg sha256 "$SHA256" \
            '{
              event_type: $event_type,
              client_payload: {
                version: $version,
                tag: $tag,
                url: $url,
                sha256: $sha256
              }
            }' | gh api --method POST --input - "repos/${TAP_REPO}/dispatches"
