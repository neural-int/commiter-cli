name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CGO_ENABLED: "1"
      GOOS: darwin
      GOARCH: arm64
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

          version="${tag#v}"
          archive="commiter_${version}_darwin_arm64.zip"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Verify release credentials are configured
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build release binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/natsuki0413/commiter-cli/internal/cli.Version=${VERSION}" \
            -o dist/commiter \
            ./cmd/commiter

      - name: Verify binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          actual_version="$(dist/commiter version)"
          expected_version="commiter ${VERSION}"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Version mismatch: expected '$expected_version', got '$actual_version'"
            exit 1
          fi

          archs="$(lipo -archs dist/commiter)"
          if [[ "$archs" != "arm64" ]]; then
            echo "::error::Expected arm64 Mach-O, got: $archs"
            exit 1
          fi

          file dist/commiter

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/commiter-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          echo "COMMITER_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Sign binary
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --keychain "$COMMITER_KEYCHAIN_PATH" \
            dist/commiter
          codesign --verify --strict --verbose=2 dist/commiter
          codesign --display --verbose=4 dist/commiter

      - name: Create release archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          package_dir="dist/package"
          mkdir -p "$package_dir"
          cp dist/commiter "$package_dir/commiter"
          cp LICENSE "$package_dir/LICENSE"
          (
            cd "$package_dir"
            zip -X -q "../${ARCHIVE}" commiter LICENSE
          )

      - name: Store notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "commiter-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$COMMITER_KEYCHAIN_PATH"

      - name: Notarize release archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/${ARCHIVE}" \
            --keychain-profile "commiter-notary" \
            --keychain "$COMMITER_KEYCHAIN_PATH" \
            --wait

      - name: Generate checksum
        shell: bash
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          (
            cd dist
            shasum -a 256 "$ARCHIVE" > checksums.txt
          )
          cat dist/checksums.txt

      - name: Create draft GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/${ARCHIVE}" \
            dist/checksums.txt \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "$TAG"

      - name: Publish GitHub Release
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/commiter-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
