name: Feature / Enhancement
description: 新機能や既存機能の改善を提案する
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景・動機
      description: 現在どのような問題・制約・不便がありますか。実装方法ではなく、まず背景を記載してください。
      placeholder: "例: 大規模 diff では planning input が上限に達し、必要な情報が過度に圧縮されることがある。"
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 利用場面
      description: どのような利用場面で必要になるかを具体的に記載してください。
      placeholder: "例: 数千行規模の変更を複数ファイルにまたがってコミット計画へ分割する場合。"
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 期待する動作
      description: commiter がどのように動くことを期待するかを記載してください。内部実装の提案は必須ではありません。
      placeholder: "例: 入力規模に応じて context budget を拡張し、過度な圧縮を避ける。"
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 現在の回避策
      description: 現在利用している回避策や代替手段があれば記載してください。
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 対象範囲
      description: この提案に含めたい範囲が明確であれば記載してください。
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: 対象外
      description: 明示的に対象外としたいものがあれば記載してください。
    validations:
      required: false

  - type: checkboxes
    id: impact
    attributes:
      label: 影響しそうな領域
      description: 分かる範囲で選択してください。複数選択できます。
      options:
        - label: CLI / command behavior
        - label: Configuration
        - label: Git / staging behavior
        - label: Model backend / runtime
        - label: Planning / LLM output
        - label: Verification
        - label: Security / privacy
        - label: Documentation / SRS
        - label: Installation / release
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: 安全性・互換性
      description: Git state、機密情報、既存 config、既存 CLI、model backend などへの互換性・安全性上の憂慮があれば記載してください。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 関連 Issue、参考実装、仕様、資料などがあれば記載してください。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 既存 Issue を検索し、同じ提案が未登録であることを確認しました。
          required: true
